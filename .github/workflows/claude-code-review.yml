name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Bu pull request'i incele.

            ÖNEMLİ: Repo kökündeki `CLAUDE.md` dosyasını oku ve içindeki tüm
            kurallara, kod standartlarına ve inceleme tonuna kesinlikle uy.

            İnceleme yaparken:
            - Değişen dosyaları repo bağlamında değerlendir (sadece diff'e değil,
              ilgili diğer dosyalara da bak).
            - Kritik sorunları (güvenlik, bug, breaking change) **🚨 BLOCKER**
              olarak işaretle.
            - Öneri seviyesindeki yorumları **💡 Suggestion** olarak işaretle.
            - Spesifik satırlara inline review comment bırak.
            - Sonunda kısa bir genel özet yaz.

            Eğer kod kaliteli ve sorun yoksa bunu da açıkça belirt.
