name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'database/migrations/**'
      - 'config/**'
      - 'composer.json'
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Bu pull request'i incele.

            ÖNEMLİ: Repo kökündeki `CLAUDE.md` dosyasını oku ve içindeki tüm
            kurallara, kod standartlarına ve inceleme tonuna kesinlikle uy.

            İnceleme yaparken:
            - Sadece DEĞİŞEN dosyalara odaklan (diff'e bak, gereksiz dosya okuma).
            - Kritik sorunları **🚨 BLOCKER** olarak işaretle.
            - Önerileri **💡 SUGGESTION** olarak işaretle.
            - Spesifik satırlara inline yorum bırakmak için
              `mcp__github_inline_comment__create_inline_comment` tool'unu kullan
              (`confirmed: true` ile).
            - Genel özet için `gh pr comment` kullan (CLAUDE.md'deki tabloya göre).

            Verimli ol — gereksiz dosya okuma, kısa ve net yorum bırak.
